<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Escáner QR</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="scanner-container">
    <div class="scanner-card">
      <div class="scanner-icon">
        <ion-icon name="qr-code-outline"></ion-icon>
      </div>
      <h1>Escáner QR</h1>
      <p>
        Escanea un código QR o de barras utilizando la cámara de tu dispositivo.
      </p>
      <ion-button expand="block" color="danger" (click)="escanear()">
        <ion-icon slot="start" name="scan-outline"></ion-icon>
        Escanear código
      </ion-button>
      @if (result) {
        <div class="result">
          <span>Resultado</span>
          <a [href]="result" target="_blank">
            {{ result }}
          </a>
        </div>
      }
    </div>
  </div>
</ion-content>
